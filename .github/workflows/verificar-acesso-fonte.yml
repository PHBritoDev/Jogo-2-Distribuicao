name: Validar acesso privado antes da migracao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Testar acesso e gerar o jogo sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
    steps:
      - name: Confirmar que o token de leitura foi configurado
        shell: bash
        run: |
          if [ -z "$SOURCE_READ_TOKEN" ]; then
            echo "::error::Crie o secret SOURCE_READ_TOKEN em Settings > Secrets and variables > Actions, com Contents: Read-only limitado ao repositorio fonte."
            exit 1
          fi
          echo "Credencial presente (o valor permanece oculto)."
      - name: Testar checkout usando somente o token
        uses: actions/checkout@v4
        with:
          repository: PHBritoDev/Jogo-2-2.5D
          ref: main
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Preparar node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de empacotamento
        working-directory: source
        run: npm install --no-save --no-package-lock --ignore-scripts esbuild@0.25.12
      - name: Montar versao publica de teste
        working-directory: source
        env:
          RELEASE_OUT: ${{ github.workspace }}/site
        run: node tools/public-release/build.cjs
      - name: Validar recursos e hashes
        working-directory: source
        env:
          RELEASE_OUT: ${{ github.workspace }}/site
        run: node --test tools/public-release/verify-release.test.mjs
      - name: Inspecionar manifest sem revelar dados privados
        shell: bash
        run: |
          node -e "const m=require('./site/release-manifest.json'); console.log('Fonte: '+m.sourceCommit+'; arquivos publicados: '+Object.keys(m.files).length)"
      - name: Resultado
        run: echo "Token e empacotamento validados. Este teste NAO publicou nem privatizou qualquer repositorio."
