name: Preparar e publicar jogo (codigo-fonte separado)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-jogo.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar em GitHub Pages (configure Settings > Pages primeiro)'
        type: boolean
        default: false
        required: true
  schedule:
    # Verificar builds uma vez ao dia. Publicacao automatica somente com AUTO_DEPLOY_PAGES=true.
    - cron: '23 9 * * *'

permissions:
  contents: read

concurrency:
  group: public-game-pages
  cancel-in-progress: false

jobs:
  build:
    name: Montar versao publica sem documentos internos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirmar credencial privada de leitura\n        env:\n          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}\n        run: |\n          if [ -z "$SOURCE_READ_TOKEN" ]; then\n            echo "::error::SOURCE_READ_TOKEN nao esta configurado; publicacao cancelada sem fallback de autenticacao."\n            exit 1\n          fi\n      - name: Buscar projeto original com credenciais de leitura apenas
        uses: actions/checkout@v4
        with:
          repository: PHBritoDev/Jogo-2-2.5D
          ref: main
          path: source
          persist-credentials: false
          token: ${{ secrets.SOURCE_READ_TOKEN }}
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar empacotador
        working-directory: source
        run: npm install --no-save --no-package-lock --ignore-scripts esbuild@0.25.12
      - name: Gerar versao publica
        working-directory: source
        env:
          RELEASE_OUT: ${{ github.workspace }}/site
        run: node tools/public-release/build.cjs
      - name: Validar integridade e dependencias do jogo
        working-directory: source
        env:
          RELEASE_OUT: ${{ github.workspace }}/site
        run: node --test tools/public-release/verify-release.test.mjs
      - name: Salvar pacote publico auditavel
        uses: actions/upload-artifact@v4
        with:
          name: jogo-publico-validado
          path: site/
          include-hidden-files: true
          retention-days: 5
          compression-level: 3
      - name: Preparar arquivos para GitHub Pages
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || vars.AUTO_DEPLOY_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Publicar no Pages
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || vars.AUTO_DEPLOY_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar somente arquivos empacotados
        id: deployment
        uses: actions/deploy-pages@v4
